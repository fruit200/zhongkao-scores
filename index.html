<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中考分数线查询 & 分数测评 - 好课在线</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container { max-width: 900px; margin: 0 auto; }
        .header { text-align: center; padding: 26px 0 18px; color: white; }
        .header h1 { font-size: 27px; font-weight: 700; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
        .header p { font-size: 14px; opacity: 0.9; }
        .header .coverage { font-size: 12px; opacity: 0.8; margin-top: 6px; }

        .mode-switch {
            display: flex; gap: 0; margin: 0 auto 16px; max-width: 360px;
            background: rgba(255,255,255,0.18); border-radius: 14px; padding: 5px;
        }
        .mode-switch button {
            flex: 1; padding: 10px; border: none; background: transparent; color: white;
            font-size: 15px; font-weight: 600; border-radius: 10px; cursor: pointer; transition: all 0.2s;
        }
        .mode-switch button.active { background: white; color: #667eea; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }

        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.15); margin-bottom: 16px; }
        .search-input-wrap { display: flex; gap: 12px; }
        .search-input-container { position: relative; flex: 1; }
        .search-input-wrap input {
            width: 100%; padding: 14px 20px; border: 2px solid #e8e8e8; border-radius: 12px;
            font-size: 16px; outline: none; transition: border-color 0.3s;
        }
        .search-input-wrap input:focus { border-color: #667eea; }
        .search-input-wrap button.go {
            padding: 14px 28px; background: linear-gradient(135deg, #667eea, #764ba2); color: white;
            border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s; white-space: nowrap;
        }
        .search-input-wrap button.go:hover { transform: translateY(-1px); }

        .suggestions {
            position: absolute; top: 100%; left: 0; right: 0; background: white; border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12); margin-top: 4px; z-index: 100; display: none; overflow: hidden;
        }
        .suggestions.show { display: block; max-height: 320px; overflow-y: auto; }
        .suggestion-item { padding: 11px 20px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #f5f5f5; }
        .suggestion-item:hover { background: #f8f9ff; }
        .suggestion-item .province { font-size: 12px; color: #999; margin-left: 8px; }
        .suggestion-item .flag { font-size: 11px; padding: 1px 7px; border-radius: 8px; margin-left: 6px; }

        .quick-tags { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .quick-tags span { font-size: 12px; color: #999; }
        .quick-tag { padding: 4px 12px; background: #f5f5f5; border-radius: 14px; font-size: 13px; color: #555; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
        .quick-tag:hover { background: #eef0ff; color: #667eea; border-color: #667eea; }

        .city-card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid #f0f0f0; }
        .city-name { font-size: 22px; font-weight: 700; display: inline-block; vertical-align: middle; }
        .city-province { font-size: 13px; color: #999; margin-top: 4px; }
        .badge-row { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
        .conf-badge { font-size: 12px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
        .conf-badge.verified { background: #e6f7ed; color: #17a44a; border: 1px solid #b6ebc8; }
        .conf-badge.mixed { background: #fff4e0; color: #d48806; border: 1px solid #ffe0a3; }
        .conf-badge.legacy { background: #f0f0f5; color: #8888a0; border: 1px solid #dcdce6; }
        .conf-badge.pending { background: #fdecec; color: #e05656; border: 1px solid #f7caca; }
        .total-score-badge { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; white-space: nowrap; }

        .year-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .year-tab { padding: 6px 14px; border-radius: 18px; font-size: 13px; cursor: pointer; background: #f5f5f5; color: #666; border: 1px solid transparent; transition: all 0.2s; }
        .year-tab.active { background: #667eea; color: white; }
        .year-tab.empty { opacity: 0.5; }
        .year-tab:hover:not(.active) { border-color: #667eea; color: #667eea; }

        .score-lines { display: grid; gap: 12px; }
        .score-line-item { display: flex; align-items: center; padding: 15px 16px; border-radius: 12px; background: #fafbff; border: 1px solid #eef0ff; }
        .score-line-label { font-size: 14px; color: #555; font-weight: 500; }
        .score-detail { flex: 1; }
        .score-line-value { font-size: 22px; font-weight: 700; color: #667eea; }
        .score-line-unit { font-size: 12px; color: #999; margin-left: 4px; }
        .score-line-bar { height: 4px; background: #e8e8e8; border-radius: 2px; margin-top: 8px; overflow: hidden; }
        .score-line-bar-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #667eea, #764ba2); transition: width 0.6s ease; }
        .src-link { font-size: 11px; color: #999; margin-top: 5px; }
        .src-link a { color: #8b9cf7; text-decoration: none; }

        .no-data { text-align: center; padding: 24px; color: #999; font-size: 14px; background: #fafafa; border-radius: 12px; line-height: 1.6; }
        .feedback-link { display: inline-block; margin-top: 10px; font-size: 13px; color: #667eea; cursor: pointer; }

        .trend-section { margin-top: 18px; padding-top: 16px; border-top: 1px solid #f0f0f0; }
        .trend-title { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 12px; }
        .trend-chart { display: flex; align-items: flex-end; gap: 6px; height: 90px; padding: 0 4px; }
        .trend-bar-group { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
        .trend-bar { width: 100%; max-width: 32px; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, #667eea, #8b9cf7); }
        .trend-bar-label { font-size: 11px; color: #999; margin-top: 6px; }
        .trend-bar-value { font-size: 10px; color: #667eea; font-weight: 600; margin-bottom: 4px; }

        .tip-card { background: #fff9e6; border: 1px solid #ffe58f; border-radius: 12px; padding: 14px 16px; margin-top: 16px; }
        .tip-card-title { font-size: 13px; font-weight: 600; color: #d48806; margin-bottom: 6px; }
        .tip-card-content { font-size: 13px; color: #8c6e00; line-height: 1.6; }

        .disclaimer { font-size: 12px; color: #e05656; margin-top: 12px; line-height: 1.5; }

        /* 测评 */
        .calc-field { margin-bottom: 16px; }
        .calc-field label { display: block; font-size: 14px; color: #555; margin-bottom: 8px; font-weight: 500; }
        .calc-select { width: 100%; padding: 12px 14px; border: 2px solid #e8e8e8; border-radius: 10px; font-size: 15px; outline: none; background: white; }
        .calc-select:focus { border-color: #667eea; }
        .input-mode-switch { display: flex; gap: 8px; margin-bottom: 14px; }
        .input-mode-switch button { flex: 1; padding: 10px; border: 1px solid #e0e0e0; background: white; border-radius: 10px; font-size: 14px; cursor: pointer; color: #666; transition: all 0.2s; }
        .input-mode-switch button.active { background: #eef0ff; border-color: #667eea; color: #667eea; font-weight: 600; }
        .total-input { width: 100%; padding: 14px 16px; border: 2px solid #e8e8e8; border-radius: 10px; font-size: 18px; font-weight: 600; outline: none; }
        .total-input:focus { border-color: #667eea; }
        .subj-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        .subj-row input { padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; outline: none; }
        .subj-row input.name { flex: 1; }
        .subj-row input.score { width: 90px; text-align: center; }
        .subj-del { width: 30px; height: 30px; border: none; background: #fdecec; color: #e05656; border-radius: 8px; cursor: pointer; font-size: 16px; flex-shrink: 0; }
        .subj-add { padding: 8px 14px; border: 1px dashed #667eea; background: #f8f9ff; color: #667eea; border-radius: 8px; font-size: 13px; cursor: pointer; margin-top: 4px; }
        .subj-sum { font-size: 14px; color: #555; margin: 10px 0 0; font-weight: 600; }
        .calc-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .calc-btn:hover { transform: translateY(-1px); }

        .result-verdict { text-align: center; padding: 22px; border-radius: 14px; margin-bottom: 16px; }
        .result-verdict.pass-key { background: linear-gradient(135deg, #17a44a, #2ecc71); color: white; }
        .result-verdict.pass-normal { background: linear-gradient(135deg, #667eea, #8b9cf7); color: white; }
        .result-verdict.below { background: linear-gradient(135deg, #e05656, #ff7b7b); color: white; }
        .result-verdict .big { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .result-verdict .sub { font-size: 14px; opacity: 0.95; }
        .gap-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .gap-item { background: #fafbff; border: 1px solid #eef0ff; border-radius: 12px; padding: 16px; text-align: center; }
        .gap-item .lbl { font-size: 13px; color: #888; margin-bottom: 6px; }
        .gap-item .val { font-size: 24px; font-weight: 700; }
        .gap-item .val.up { color: #17a44a; }
        .gap-item .val.down { color: #e05656; }
        .gap-item .val .suf { font-size: 13px; }

        .tier-list { margin: 4px 0 16px; }
        .tier-item { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-radius: 10px; margin-bottom: 8px; font-size: 14px; }
        .tier-item.hit { background: #e6f7ed; border: 1px solid #b6ebc8; }
        .tier-item.miss { background: #fafafa; border: 1px solid #eee; color: #999; }
        .tier-item .t-name { font-weight: 500; }
        .tier-item .t-line { color: #666; font-size: 13px; }
        .tier-item .t-flag { font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 10px; }
        .tier-item.hit .t-flag { background: #17a44a; color: white; }
        .tier-item.miss .t-flag { background: #e0e0e0; color: #888; }
        .analysis-card { background: #f8f9ff; border: 1px solid #e8ecff; border-radius: 12px; padding: 16px; margin-bottom: 10px; }
        .analysis-card h4 { font-size: 14px; color: #667eea; margin-bottom: 8px; }
        .analysis-card p { font-size: 13px; color: #555; line-height: 1.7; }

        .footer { text-align: center; padding: 20px; color: rgba(255,255,255,0.7); font-size: 12px; }
        .hidden { display: none; }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .header h1 { font-size: 21px; }
            .card { padding: 16px; }
            .search-input-wrap { flex-direction: column; }
            .search-input-wrap button.go { width: 100%; }
            .score-line-value { font-size: 20px; }
            .gap-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 中考分数线查询</h1>
            <p>全国地级市覆盖 · 历年重点线 & 普高线 + 分数测评</p>
            <div class="coverage" id="coverageInfo"></div>
        </div>

        <div class="mode-switch">
            <button id="modeSearchBtn" class="active" onclick="switchMode('search')">🔍 查分数线</button>
            <button id="modeCalcBtn" onclick="switchMode('calc')">🧮 分数测评</button>
        </div>

        <!-- 查分模式 -->
        <div id="searchMode">
            <div class="card">
                <div class="search-input-wrap">
                    <div class="search-input-container">
                        <input type="text" id="searchInput" placeholder="输入城市或省份，如：北京、成都、河南..." autocomplete="off">
                        <div class="suggestions" id="suggestions"></div>
                    </div>
                    <button class="go" onclick="doSearch()">查询</button>
                </div>
                <div class="quick-tags">
                    <span>热门：</span>
                    <div class="quick-tag" onclick="quickSearch('北京')">北京</div>
                    <div class="quick-tag" onclick="quickSearch('上海')">上海</div>
                    <div class="quick-tag" onclick="quickSearch('广州')">广州</div>
                    <div class="quick-tag" onclick="quickSearch('深圳')">深圳</div>
                    <div class="quick-tag" onclick="quickSearch('成都')">成都</div>
                    <div class="quick-tag" onclick="quickSearch('武汉')">武汉</div>
                    <div class="quick-tag" onclick="quickSearch('杭州')">杭州</div>
                    <div class="quick-tag" onclick="quickSearch('郑州')">郑州</div>
                </div>
            </div>
            <div id="results"></div>
        </div>

        <!-- 测评模式 -->
        <div id="calcMode" class="hidden">
            <div class="card">
                <div class="calc-field">
                    <label>选择城市</label>
                    <input type="text" class="calc-select" id="calcCityInput" list="calcCityList" placeholder="输入或选择城市，如：北京" autocomplete="off" oninput="onCalcCityInput()">
                    <datalist id="calcCityList"></datalist>
                </div>
                <div class="calc-field" id="calcYearField" style="display:none;">
                    <label>选择年份</label>
                    <select class="calc-select" id="calcYearSelect" onchange="onCalcYearChange()"></select>
                </div>

                <div class="input-mode-switch">
                    <button id="inputTotalBtn" class="active" onclick="switchInputMode('total')">填总分</button>
                    <button id="inputSubjBtn" onclick="switchInputMode('subject')">填各科分数</button>
                </div>

                <div id="totalInputArea" class="calc-field">
                    <label>考生中考总分</label>
                    <input type="number" class="total-input" id="totalScoreInput" placeholder="输入总分，如：520" min="0">
                </div>

                <div id="subjectInputArea" class="calc-field hidden">
                    <label>各科分数（自动累加为总分）</label>
                    <div id="subjectRows"></div>
                    <button class="subj-add" onclick="addSubjectRow()">＋ 添加科目</button>
                    <div class="subj-sum">当前合计：<span id="subjectSum">0</span> 分</div>
                </div>

                <button class="calc-btn" onclick="doCalc()">开始测评</button>
            </div>
            <div id="calcResults"></div>
        </div>

        <div class="footer">
            <p>数据来源：各市教育局公开公告（见每条分数线下方链接）| 仅供内部参考</p>
            <p style="margin-top:4px;">标注"待核实"的数据尚未逐条验证，正式引用前请核对官方公告</p>
        </div>
    </div>

    <script src="data.js"></script>
    <script>
    const STORE = window.CITY_DATA || { meta:{}, cities:[] };
    const CITY_DATA = STORE.cities;
    const DATA_TOTAL = STORE.meta.total || CITY_DATA.length;
    const ST = STORE.meta.stats || {};

    const searchInput = document.getElementById('searchInput');
    const suggestionsEl = document.getElementById('suggestions');
    const resultsEl = document.getElementById('results');

    document.getElementById('coverageInfo').innerHTML =
        `已收录 ${DATA_TOTAL} 个城市 · 已验证 ${ST.verified+ST.mixed||0} · 待核实 ${ST.legacy||0} · 待补充 ${ST.pending||0}`;

    const STATUS_LABEL = { verified:'已验证', mixed:'部分验证', legacy:'待核实', pending:'待补充' };

    // ---------- helpers ----------
    function cityByName(n){ return CITY_DATA.find(c => c.city === n); }
    function orderedLines(yearData){
        return Object.entries(yearData.lines || {}).sort((a,b)=> b[1]-a[1]);
    }
    function keyAndNormal(yearData){
        const entries = orderedLines(yearData);
        if (!entries.length) return { key:null, normal:null, entries:[] };
        const key = entries[0];                              // 分值最高 = 重点线
        const lowest = entries[entries.length-1];            // 分值最低 = 普高/控制线
        const normal = (entries.length>=2) ? lowest : key;
        return { key:{name:key[0], score:key[1]}, normal:{name:normal[0], score:normal[1]}, entries };
    }
    function latestDataYear(city){
        return (city.years||[]).find(y => Object.keys(y.lines||{}).length>0) || null;
    }
    function hasData(city){ return (city.years||[]).some(y => Object.keys(y.lines||{}).length>0); }
    // 优先选"最新且有≥2条分数线"的年份做默认，保证重点/普高分差对比有意义；否则退回最新有数据年份
    function bestDefaultYear(city){
        const dataYears=(city.years||[]).filter(y=>Object.keys(y.lines||{}).length>0);
        const rich=dataYears.find(y=>Object.keys(y.lines).length>=2);
        return rich || dataYears[0] || null;
    }
    function yearConfBadge(yearData){
        if (yearData.confidence==='verified-high') return '<span class="conf-badge verified">已验证</span>';
        if (yearData.confidence==='legacy-low') return '<span class="conf-badge legacy">待核实</span>';
        return '<span class="conf-badge pending">待补充</span>';
    }

    // ---------- mode switch ----------
    function switchMode(m){
        const searchBtn=document.getElementById('modeSearchBtn'), calcBtn=document.getElementById('modeCalcBtn');
        const searchArea=document.getElementById('searchMode'), calcArea=document.getElementById('calcMode');
        if (m==='search'){ searchBtn.classList.add('active'); calcBtn.classList.remove('active'); searchArea.classList.remove('hidden'); calcArea.classList.add('hidden'); }
        else { calcBtn.classList.add('active'); searchBtn.classList.remove('active'); calcArea.classList.remove('hidden'); searchArea.classList.add('hidden'); initCalc(); }
    }

    // ---------- search ----------
    searchInput.addEventListener('input', function(){
        const val=this.value.trim();
        if(!val){ suggestionsEl.classList.remove('show'); return; }
        const matches=CITY_DATA.filter(c=>c.city.includes(val)||c.province.includes(val)||val.includes(c.city)).slice(0,12);
        if(matches.length){
            suggestionsEl.innerHTML=matches.map(c=>{
                const has=hasData(c);
                const flag=has?`<span class="flag" style="background:#eef0ff;color:#667eea">${STATUS_LABEL[c.status]}</span>`:`<span class="flag" style="background:#fdecec;color:#e05656">待补充</span>`;
                return `<div class="suggestion-item" onclick="selectCity('${c.city}')">${c.city}<span class="province">${c.province}</span>${flag}</div>`;
            }).join('');
            suggestionsEl.classList.add('show');
        } else suggestionsEl.classList.remove('show');
    });
    searchInput.addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });
    document.addEventListener('click',e=>{ if(!e.target.closest('.search-input-container')) suggestionsEl.classList.remove('show'); });

    function selectCity(city){ searchInput.value=city; suggestionsEl.classList.remove('show'); doSearch(); }
    function quickSearch(city){ searchInput.value=city; doSearch(); }

    function doSearch(){
        const val=searchInput.value.trim(); if(!val) return;
        suggestionsEl.classList.remove('show');
        const matches=CITY_DATA.filter(c=>c.city.includes(val)||c.province.includes(val)||val.includes(c.city));
        if(!matches.length){
            resultsEl.innerHTML=`<div class="card"><div class="no-data">未找到"${val}"的数据<br><span style="font-size:13px;">请尝试省份名或其他城市，或联系培训部补充</span></div></div>`;
            return;
        }
        matches.sort((a,b)=>(hasData(b)-hasData(a)) || a.city.localeCompare(b.city,'zh'));
        const toShow=matches.slice(0,8);
        resultsEl.innerHTML=toShow.map(renderCityCard).join('') +
            (matches.length>8?`<div class="card"><div class="no-data">"${val}" 共匹配 ${matches.length} 个城市，已展示前 8 个，可输入更精确的城市名</div></div>`:'');
    }

    function renderCityCard(city){
        const yId='yearTabs_'+encodeURIComponent(city.city);
        const sId='scoreLines_'+encodeURIComponent(city.city);
        const confBadge=`<span class="conf-badge ${city.status}">${STATUS_LABEL[city.status]}</span>`;
        if(!hasData(city)){
            return `<div class="card">
                <div class="city-card-header">
                    <div>
                        <div class="city-name">${city.city}</div>
                        <div class="city-province">${city.province}</div>
                        <div class="badge-row">${confBadge}</div>
                    </div>
                </div>
                <div class="no-data">该城市暂无公开分数线数据，欢迎补充<br><span class="feedback-link" onclick="alert('请把教育局公告链接发到培训部群，我们会补充数据 🙌')">📮 提交线索</span></div>
            </div>`;
        }
        const defaultYear=bestDefaultYear(city);
        const defaultIdx=city.years.indexOf(defaultYear);
        const tabs=city.years.map((y,i)=>{
            const empty=Object.keys(y.lines||{}).length===0;
            return `<div class="year-tab ${i===defaultIdx?'active':''} ${empty?'empty':''}" onclick="switchYear('${city.city}',${i},'${yId}','${sId}')">${y.year}${empty?'·空':''}</div>`;
        }).join('');
        return `<div class="card">
            <div class="city-card-header">
                <div>
                    <div class="city-name">${city.city}</div>
                    <div class="city-province">${city.province}</div>
                    <div class="badge-row">${confBadge}</div>
                </div>
                ${city.totalScore?`<div class="total-score-badge">满分 ${city.totalScore} 分</div>`:''}
            </div>
            <div class="year-tabs" id="${yId}">${tabs}</div>
            <div class="score-lines" id="${sId}">${renderScoreLines(defaultYear, city)}</div>
            ${renderTrend(city)}
            ${city.tip?`<div class="tip-card"><div class="tip-card-title">💡 沟通参考</div><div class="tip-card-content">${city.tip}</div></div>`:''}
            ${city.status==='legacy'?`<div class="disclaimer">⚠️ 该城市数据来自历史整理，尚未逐条核对官方公告，正式引用前请验证。</div>`:''}
        </div>`;
    }

    function renderScoreLines(yearData, city){
        if(!yearData || !Object.keys(yearData.lines||{}).length)
            return `<div class="no-data">${yearData?yearData.year+'年':'该年'}暂无公开数据</div>`;
        const lines=orderedLines(yearData);
        return lines.map(([name,score])=>{
            const pct=city.totalScore?(score/city.totalScore*100).toFixed(1):'';
            const src=yearData.sources&&yearData.sources[name];
            const srcHtml=src?`<div class="src-link"><a href="${src}" target="_blank" rel="noopener">📎 查看来源</a></div>`:'';
            const note=yearData.notes&&yearData.notes[name];
            const noteHtml=note?`<div class="src-link" style="color:#d48806">📝 ${note}</div>`:'';
            return `<div class="score-line-item">
                <div class="score-detail">
                    <div class="score-line-label">${name}</div>
                    <div class="score-line-bar"><div class="score-line-bar-fill" style="width:${pct||0}%"></div></div>
                    ${srcHtml}${noteHtml}
                </div>
                <div>
                    <span class="score-line-value">${score}</span>
                    <span class="score-line-unit">${pct?'分 ('+pct+'%)':'分'}</span>
                </div>
            </div>`;
        }).join('')+`<div style="margin-top:4px">${yearConfBadge(yearData)}</div>`;
    }

    function renderTrend(city){
        const dataYears=city.years.filter(y=>Object.keys(y.lines||{}).length>0);
        if(dataYears.length<2) return '';
        const chrono=[...dataYears].sort((a,b)=>a.year-b.year);
        const keyName=keyAndNormal(chrono[0]).key;
        if(!keyName) return '';
        const vals=chrono.map(y=>{ const e=orderedLines(y)[0]; return e?e[1]:0; });
        const maxV=Math.max(...vals)||1;
        const bars=chrono.map((y,i)=>{
            const e=orderedLines(y)[0]; const v=e?e[1]:0; const h=(v/maxV)*58+8;
            return `<div class="trend-bar-group"><div class="trend-bar-value">${v}</div><div class="trend-bar" style="height:${h}px"></div><div class="trend-bar-label">${y.year}</div></div>`;
        }).join('');
        return `<div class="trend-section"><div class="trend-title">📈 重点线（${keyName.name}）历年趋势</div><div class="trend-chart">${bars}</div></div>`;
    }

    function switchYear(city, i, yId, sId){
        const c=cityByName(city); if(!c) return;
        document.querySelectorAll('#'+CSS.escape(yId)+' .year-tab').forEach((t,idx)=>t.classList.toggle('active',idx===i));
        document.getElementById(sId).innerHTML=renderScoreLines(c.years[i], c);
    }

    // ---------- 分数测评 ----------
    let calcInputMode='total';
    let calcInitialized=false;
    function initCalc(){
        if(calcInitialized){ return; }
        calcInitialized=true;
        document.getElementById('calcCityList').innerHTML=CITY_DATA.filter(hasData).map(c=>`<option value="${c.city}">${c.province}</option>`).join('');
        addSubjectRow('语文'); addSubjectRow('数学'); addSubjectRow('英语');
    }
    function onCalcCityInput(){
        const name=document.getElementById('calcCityInput').value.trim();
        const c=cityByName(name);
        const field=document.getElementById('calcYearField');
        const sel=document.getElementById('calcYearSelect');
        if(c && hasData(c)){
            const dataYears=c.years.filter(y=>Object.keys(y.lines||{}).length>0);
            const defY=bestDefaultYear(c);
            field.style.display='';
            sel.innerHTML=dataYears.map((y)=>{ const k=keyAndNormal(y).key, n=keyAndNormal(y).normal; return `<option value="${y.year}" ${y===defY?'selected':''}>${y.year}年 · 重点${k?k.score:'—'}分 / 普高${n?n.score:'—'}分</option>`; }).join('');
        } else field.style.display='none';
    }
    function onCalcYearChange(){}

    function switchInputMode(m){
        calcInputMode=m;
        document.getElementById('inputTotalBtn').classList.toggle('active',m==='total');
        document.getElementById('inputSubjBtn').classList.toggle('active',m==='subject');
        document.getElementById('totalInputArea').classList.toggle('hidden',m!=='total');
        document.getElementById('subjectInputArea').classList.toggle('hidden',m!=='subject');
    }
    function addSubjectRow(name){
        const wrap=document.getElementById('subjectRows');
        const row=document.createElement('div'); row.className='subj-row';
        row.innerHTML=`<input class="name" type="text" placeholder="科目名" value="${name||''}"><input class="score" type="number" placeholder="分数" min="0" oninput="updateSubjectSum()"><button class="subj-del" onclick="delSubjectRow(this)">×</button>`;
        wrap.appendChild(row);
    }
    function delSubjectRow(btn){ btn.parentElement.remove(); updateSubjectSum(); }
    function updateSubjectSum(){
        let sum=0;
        document.querySelectorAll('#subjectRows .score').forEach(i=>{ sum+=parseFloat(i.value)||0; });
        document.getElementById('subjectSum').textContent=sum;
    }

    function doCalc(){
        const out=document.getElementById('calcResults');
        const cityName=document.getElementById('calcCityInput').value.trim();
        const c=cityByName(cityName);
        if(!c){ out.innerHTML=`<div class="card"><div class="no-data">请选择一个有数据的城市</div></div>`; return; }
        if(!hasData(c)){ out.innerHTML=`<div class="card"><div class="no-data">${c.city}暂无公开分数线数据，无法测评</div></div>`; return; }
        const year=parseInt(document.getElementById('calcYearSelect').value)|| bestDefaultYear(c).year;
        const yearData=c.years.find(y=>y.year===year);
        if(!yearData||!Object.keys(yearData.lines||{}).length){ out.innerHTML=`<div class="card"><div class="no-data">${year}年暂无数据</div></div>`; return; }

        let total;
        if(calcInputMode==='total'){ total=parseFloat(document.getElementById('totalScoreInput').value); }
        else { total=0; document.querySelectorAll('#subjectRows .score').forEach(i=>total+=parseFloat(i.value)||0); }
        if(total===undefined||isNaN(total)||total<=0){ out.innerHTML=`<div class="card"><div class="no-data">请输入有效的分数</div></div>`; return; }

        const {key,normal,entries}=keyAndNormal(yearData);
        out.innerHTML=renderCalcResult(c, yearData, total, key, normal, entries);
    }

    function renderCalcResult(city, yearData, total, key, normal, entries){
        const keyScore=key.score, normScore=normal.score;
        const passKey=total>=keyScore, passNorm=total>=normScore;

        let verdictClass, verdictBig, verdictSub;
        if(passKey){ verdictClass='pass-key'; verdictBig='🎉 达重点高中线'; verdictSub=`超过${key.name} ${(total-keyScore)} 分`; }
        else if(passNorm){ verdictClass='pass-normal'; verdictBig='✅ 达普通高中线'; verdictSub=`过普高 ${(total-normScore)} 分，距重点还差 ${(keyScore-total)} 分`; }
        else { verdictClass='below'; verdictBig='⚠️ 未达普高线'; verdictSub=`距${normal.name}还差 ${(normScore-total)} 分`; }

        function gapHtml(target, tname){
            const diff=total-target;
            const cls=diff>=0?'up':'down';
            const arrow=diff>=0?'↑ 超出':'↓ 差';
            return `<div class="gap-item"><div class="lbl">${tname} · ${target}分</div><div class="val ${cls}">${arrow} ${Math.abs(diff)}<span class="suf"> 分</span></div></div>`;
        }

        const tierItems=entries.map(([name,score])=>{
            const hit=total>=score;
            return `<div class="tier-item ${hit?'hit':'miss'}"><div><span class="t-name">${name}</span> <span class="t-line">(${score}分)</span></div><span class="t-flag">${hit?'达标 ✓':'未达 · 差'+(score-total)+'分'}</span></div>`;
        }).join('');

        let analysis='';
        const pct=city.totalScore?(total/city.totalScore*100).toFixed(1):null;
        if(passKey){
            analysis=`考生总分 <b>${total}</b> 分${pct?`（约占满分 ${pct}%）`:''}，已越过重点高中线 <b>${key.name}</b>（${keyScore}分）。${keyScore>normScore?`领先普高线 <b>${(total-normScore)}</b> 分，可选择的学校层次较宽裕。`:''}建议把优势转化为更好的目标校——关注该校的分区/指标到校名额与实验班线，冲刺更高平台。`;
        } else if(passNorm){
            analysis=`考生总分 <b>${total}</b> 分${pct?`（约占满分 ${pct}%）`:''}，已过普高线（${normScore}分），但距重点线 <b>${key.name}</b>（${keyScore}分）还差 <b>${keyScore-total}</b> 分。这一段是提分性价比较高的空间——通常补强 1～2 个薄弱学科就能跨过重点门槛，是冲刺阶段最值得投入的目标。`;
        } else {
            analysis=`考生总分 <b>${total}</b> 分${pct?`（约占满分 ${pct}%）`:''}，距普高线（${normScore}分）还差 <b>${normScore-total}</b> 分。当前应稳住基础分、优先攻提分快的科目，先把普高线守住，再谈重点。`;
        }

        return `<div class="card">
            <div class="city-card-header" style="margin-bottom:14px;">
                <div>
                    <div class="city-name">${city.city} · ${yearData.year}年</div>
                    <div class="city-province">${city.province}${city.totalScore?` · 中考满分 ${city.totalScore} 分`:''} · 考生总分 <b style="color:#667eea">${total}</b> 分</div>
                </div>
                ${yearConfBadge(yearData)}
            </div>
            <div class="result-verdict ${verdictClass}"><div class="big">${verdictBig}</div><div class="sub">${verdictSub}</div></div>
            <div class="gap-grid">
                ${gapHtml(keyScore, '重点线')}
                ${gapHtml(normScore, '普高线')}
            </div>
            <div class="analysis-card"><h4>📋 各档位达标情况</h4><div class="tier-list" style="margin:0;">${tierItems}</div></div>
            <div class="analysis-card"><h4>💡 简要分析</h4><p>${analysis}</p></div>
            ${city.status==='legacy'?`<div class="disclaimer">⚠️ 该城市分数线为历史整理数据、尚未核对官方公告，测评结果仅供参考。</div>`:''}
        </div>`;
    }
    </script>
</body>
</html>
