<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            padding: 30px 0 20px;
            color: white;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .header p {
            font-size: 14px;
            opacity: 0.85;
        }
        .search-box {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }
        .search-input-wrap {
            display: flex;
            gap: 12px;
        }
        .search-input-wrap input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        .search-input-wrap input:focus {
            border-color: #667eea;
        }
        .search-input-wrap button {
            padding: 14px 28px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }
        .search-input-wrap button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(102,126,234,0.4);
        }
        .search-input-wrap button:active {
            transform: translateY(0);
        }
        .quick-tags {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .quick-tags span {
            font-size: 12px;
            color: #999;
            line-height: 28px;
        }
        .quick-tag {
            padding: 4px 12px;
            background: #f5f5f5;
            border-radius: 14px;
            font-size: 13px;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }
        .quick-tag:hover {
            background: #eef0ff;
            color: #667eea;
            border-color: #667eea;
        }
        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.12);
            margin-top: 4px;
            z-index: 100;
            display: none;
            overflow: hidden;
        }
        .suggestions.show { display: block; }
        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
            transition: background 0.15s;
            border-bottom: 1px solid #f5f5f5;
        }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background: #f8f9ff; }
        .suggestion-item .province {
            font-size: 12px;
            color: #999;
            margin-left: 8px;
        }
        .search-input-container { position: relative; flex: 1; }
        .search-input-container input { width: 100%; }

        .results {
            display: none;
        }
        .results.show { display: block; }
        .city-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            margin-bottom: 16px;
        }
        .city-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #f0f0f0;
        }
        .city-name {
            font-size: 22px;
            font-weight: 700;
            color: #333;
        }
        .city-province {
            font-size: 13px;
            color: #999;
            margin-top: 4px;
        }
        .total-score-badge {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
        .year-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .year-tab {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            background: #f5f5f5;
            color: #666;
            border: 1px solid transparent;
        }
        .year-tab.active {
            background: #667eea;
            color: white;
        }
        .year-tab:hover:not(.active) {
            border-color: #667eea;
            color: #667eea;
        }
        .score-lines {
            display: grid;
            gap: 12px;
        }
        .score-line-item {
            display: flex;
            align-items: center;
            padding: 16px;
            border-radius: 12px;
            background: #fafbff;
            border: 1px solid #eef0ff;
            transition: transform 0.2s;
        }
        .score-line-item:hover {
            transform: translateX(4px);
        }
        .score-line-label {
            flex: 1;
            font-size: 14px;
            color: #555;
            font-weight: 500;
        }
        .score-line-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }
        .score-line-unit {
            font-size: 12px;
            color: #999;
            margin-left: 4px;
        }
        .score-line-bar {
            height: 4px;
            background: #e8e8e8;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .score-line-bar-fill {
            height: 100%;
            border-radius: 2px;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.6s ease;
        }
        .score-detail {
            flex: 1;
        }
        .trend-section {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid #f0f0f0;
        }
        .trend-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }
        .trend-chart {
            display: flex;
            align-items: flex-end;
            gap: 4px;
            height: 80px;
            padding: 0 4px;
        }
        .trend-bar-group {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            justify-content: flex-end;
        }
        .trend-bar {
            width: 100%;
            max-width: 30px;
            border-radius: 4px 4px 0 0;
            transition: height 0.5s ease;
            position: relative;
        }
        .trend-bar.key { background: linear-gradient(180deg, #667eea, #8b9cf7); }
        .trend-bar.normal { background: linear-gradient(180deg, #a8b5f7, #c5cdfb); }
        .trend-bar-label {
            font-size: 10px;
            color: #999;
            margin-top: 6px;
        }
        .trend-bar-value {
            font-size: 10px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .legend {
            display: flex;
            gap: 16px;
            margin-top: 12px;
            justify-content: center;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #666;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
        }
        .legend-dot.key { background: #667eea; }
        .legend-dot.normal { background: #a8b5f7; }

        .tip-card {
            background: #fff9e6;
            border: 1px solid #ffe58f;
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
        }
        .tip-card-title {
            font-size: 13px;
            font-weight: 600;
            color: #d48806;
            margin-bottom: 8px;
        }
        .tip-card-content {
            font-size: 13px;
            color: #8c6e00;
            line-height: 1.6;
        }

            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);

        .no-result-icon { font-size: 48px; margin-bottom: 16px; }
        .no-result-text { font-size: 16px; color: #666; margin-bottom: 8px; }
        .no-result-hint { font-size: 13px; color: #999; }

        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 12px;
        }

            margin-top: 16px;
        }
        .all-cities-title {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 12px;
            font-weight: 500;
        }
        .city-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }
        .city-grid-item {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            color: white;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .city-grid-item:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            body { padding: 12px; }
            .header h1 { font-size: 22px; }
            .search-box { padding: 16px; }
            .search-input-wrap { flex-direction: column; }
            .search-input-wrap button { width: 100%; }
            .city-card { padding: 16px; }
            .score-line-value { font-size: 20px; }
            .city-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); }
        }
    </style>
</head>

    // ============ 功能逻辑 ============
    const searchInput = document.getElementById('searchInput');
    const suggestionsEl = document.getElementById('suggestions');
    const resultsEl = document.getElementById('results');
    const allCitiesSection = document.getElementById('allCitiesSection');

    // 初始化城市网格
    function initCityGrid() {
        const grid = document.getElementById('cityGrid');
        grid.innerHTML = CITY_DATA.map(c =>
            `<div class="city-grid-item" onclick="quickSearch('${c.city}')">${c.city}</div>`
        ).join('');
    }

    // 搜索建议
    searchInput.addEventListener('input', function() {
        const val = this.value.trim();
        if (!val) {
            suggestionsEl.classList.remove('show');
            return;
        }
        const matches = CITY_DATA.filter(c =>
            c.city.includes(val) || c.province.includes(val)
        ).slice(0, 8);

        if (matches.length > 0) {
            suggestionsEl.innerHTML = matches.map(c =>
                `<div class="suggestion-item" onclick="selectCity('${c.city}')">
                    ${c.city}<span class="province">${c.province}</span>
                </div>`
            ).join('');
            suggestionsEl.classList.add('show');
        } else {
            suggestionsEl.classList.remove('show');
        }
    });

    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') doSearch();
    });

    document.addEventListener('click', function(e) {
        if (!e.target.closest('.search-input-container')) {
            suggestionsEl.classList.remove('show');
        }
    });

    function selectCity(city) {
        searchInput.value = city;
        suggestionsEl.classList.remove('show');
        doSearch();
    }

    function quickSearch(city) {
        searchInput.value = city;
        doSearch();
    }

    function doSearch() {
        const val = searchInput.value.trim();
        if (!val) return;

        suggestionsEl.classList.remove('show');
        allCitiesSection.style.display = 'none';

        // 模糊搜索：城市名或省份名
        const matches = CITY_DATA.filter(c =>
            c.city.includes(val) || c.province.includes(val) || val.includes(c.city)
        );

        if (matches.length === 0) {
            resultsEl.innerHTML = `
                <div class="no-result">
                    <div class="no-result-icon">🔍</div>
                    <div class="no-result-text">未找到"${val}"的中考数据</div>
                    <div class="no-result-hint">请尝试输入省份名或其他城市名，或联系培训部添加数据</div>
                </div>
            `;
        } else {
            resultsEl.innerHTML = matches.map(c => renderCityCard(c)).join('');
        }
        resultsEl.classList.add('show');
    }

    function renderCityCard(cityData) {
        const latestYear = cityData.years[0];
        const lineKeys = Object.keys(latestYear.lines);
        const primaryKey = lineKeys[0]; // 第一条线作为重点线

        // 趋势数据
        const trendData = [...cityData.years].reverse();
        const maxScore = Math.max(...trendData.map(y => y.lines[primaryKey]));

        const trendBars = trendData.map(y => {
            const keyVal = y.lines[primaryKey];
            const normalKey = Object.keys(y.lines).find(k => k.includes('普通'));
            const normalVal = normalKey ? y.lines[normalKey] : 0;
            const keyHeight = (keyVal / maxScore) * 60;
            const normalHeight = normalVal ? (normalVal / maxScore) * 60 : 0;
            return `
                <div class="trend-bar-group">
                    <div class="trend-bar-value">${keyVal}</div>
                    <div class="trend-bar key" style="height:${keyHeight}px"></div>
                    <div class="trend-bar-label">${y.year}</div>
                </div>
            `;
        }).join('');

        return `
            <div class="city-card">
                <div class="city-card-header">
                    <div>
                        <div class="city-name">${cityData.city}</div>
                        <div class="city-province">${cityData.province}</div>
                    </div>
                    <div class="total-score-badge">满分 ${cityData.totalScore} 分</div>
                </div>

                <div class="year-tabs" id="yearTabs_${cityData.city}">
                    ${cityData.years.map((y, i) =>
                        `<div class="year-tab ${i===0?'active':''}" onclick="switchYear('${cityData.city}', ${i})">${y.year}年</div>`
                    ).join('')}
                </div>

                <div class="score-lines" id="scoreLines_${cityData.city}">
                    ${renderScoreLines(latestYear.lines, cityData.totalScore)}
                </div>

                <div class="trend-section">
                    <div class="trend-title">📈 ${primaryKey} 历年趋势</div>
                    <div class="trend-chart">${trendBars}</div>
                    <div class="legend">
                        <div class="legend-item"><div class="legend-dot key"></div>${primaryKey}</div>
                    </div>
                </div>

                ${cityData.tip ? `
                <div class="tip-card">
                    <div class="tip-card-title">💡 沟通参考</div>
                    <div class="tip-card-content">${cityData.tip}</div>
                </div>` : ''}
            </div>
        `;
    }

    function renderScoreLines(lines, totalScore) {
        return Object.entries(lines).map(([name, score]) => {
            const pct = (score / totalScore * 100).toFixed(1);
            return `
                <div class="score-line-item">
                    <div class="score-detail">
                        <div class="score-line-label">${name}</div>
                        <div class="score-line-bar">
                            <div class="score-line-bar-fill" style="width:${pct}%"></div>
                        </div>
                    </div>
                    <div>
                        <span class="score-line-value">${score}</span>
                        <span class="score-line-unit">分 (${pct}%)</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    function switchYear(city, yearIndex) {
        const cityData = CITY_DATA.find(c => c.city === city);
        if (!cityData) return;

        // 更新tab状态
        const tabs = document.querySelectorAll(`#yearTabs_${city} .year-tab`);
        tabs.forEach((t, i) => t.classList.toggle('active', i === yearIndex));

        // 更新分数线
        const yearData = cityData.years[yearIndex];
        document.getElementById(`scoreLines_${city}`).innerHTML =
            renderScoreLines(yearData.lines, cityData.totalScore);
    }

    // 初始化
    initCityGrid();
